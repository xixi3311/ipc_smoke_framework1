[pytest]
addopts = -vs --alluredir=./reports/allure-results
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .  ;
markers =
    markers =
    smoke: Smoke test cases for quick verification
    stress: Long-term stress test cases like OTA loop
    regression: Regression test cases (e.g., device deletion)
log_cli = true
log_cli_format = [%(asctime)s] %(message)s
log_cli_date_format = %H:%M:%S
log_file = logs/pytest_run.log
log_file_format = [%(asctime)s] %(message)s
log_file_date_format = %H:%M:%S